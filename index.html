    * { box-sizing:border-box; margin:0; padding:0; }
    body {

      background:linear-gradient(135deg,var(--donker) 0%,var(--donker2) 100%);

      display:flex; flex-direction:column; align-items:center;
      padding:20px; overflow-x:hidden;
    }
    h1 {
      font-family:'Bangers',cursive; font-size:clamp(2.2rem,8vw,4rem);
      color:var(--bier); text-align:center; letter-spacing:3px;

    .subtitle { font-size:.95rem; color:#aaa; text-align:center; margin-bottom:28px; font-style:italic; }

    /* schermen */

    .scherm.actief { display:flex; flex-direction:column; align-items:center; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

    /* naam invoer */

    .naam-rij {
      display:flex; align-items:center; background:var(--kaart);
      border-radius:14px; padding:10px 16px; gap:12px;
      border:2px solid transparent; transition:border-color .2s;
    }
    .naam-rij:focus-within { border-color:var(--bier); }
    .naam-nummer { font-family:'Bangers',cursive; font-size:1.5rem; color:var(--bier); min-width:28px; }
    .naam-input {
      flex:1; background:transparent; border:none; outline:none;
      font-family:'Nunito',sans-serif; font-size:1.1rem; font-weight:700; color:var(--wit);
    }
    .naam-input::placeholder { color:#666; font-weight:400; }

    /* knoppen */
    .btn {
      font-family:'Bangers',cursive; font-size:1.6rem; letter-spacing:2px;
      border:none; border-radius:50px; padding:14px 40px; cursor:pointer;
      transition:all .15s; margin-top:8px; text-transform:uppercase;
    }
    .btn:active { transform:scale(.95); }
    .btn-bier  { background:var(--bier);  color:#111; box-shadow:0 6px 0 var(--bier-dark); }
    .btn-bier:hover  { box-shadow:0 8px 0 var(--bier-dark); transform:translateY(-2px); }
    .btn-groen { background:var(--groen); color:#fff; box-shadow:0 6px 0 #007a65; }
    .btn-groen:hover { box-shadow:0 8px 0 #007a65; transform:translateY(-2px); }
    .btn-rood  { background:var(--rood);  color:#fff; box-shadow:0 6px 0 #a02020; }
    .btn-rood:hover  { box-shadow:0 8px 0 #a02020; transform:translateY(-2px); }
    .btn-klein { font-size:1rem; padding:10px 24px; margin-top:6px; }

    /* spelersbalk */
    .spelers-bar { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:20px; width:100%; }
    .speler-chip {
      background:var(--kaart); border-radius:30px; padding:6px 16px;
      font-size:.9rem; font-weight:700; border:2px solid #333; transition:all .3s;
    }
    .speler-chip.actief { border-color:var(--bier); background:var(--bier); color:#111; transform:scale(1.1); }

    /* beker */

    .bier-beker {
      width:220px; height:220px; border-radius:50%;
      background:conic-gradient(var(--bier) 0deg,var(--bier-dark) 60deg,var(--bier) 120deg,

//  AUDIO ENGINE
// ══════════════════════════════════════════════
let audioCtx = null;
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playTick(when, volume = 0.18) {
  const ctx = getCtx();
  const osc = ctx.createOscillator();
  const g   = ctx.createGain();
  osc.type = 'square';
  osc.frequency.value = 900;
  g.gain.setValueAtTime(0, when);
  g.gain.linearRampToValueAtTime(volume, when + 0.008);
  g.gain.exponentialRampToValueAtTime(0.001, when + 0.055);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(when); osc.stop(when + 0.06);
}

function playSpinTicks(totalMs) {
  const ctx  = getCtx();
  const now  = ctx.currentTime;
  const dur  = totalMs / 1000;
  let t = 0, iv = 0.085;
  while (t < dur) {
    playTick(now + t, t < dur * 0.15 ? 0.1 + (t / (dur * 0.15)) * 0.1 : 0.2);
    const prog = t / dur;
    if (prog < 0.25)      iv = Math.max(0.042, iv - 0.004);
    else if (prog > 0.55) iv = Math.min(0.38,  iv + 0.018);
    t += iv;
  }
  // Final heavier tick at end
  playTick(now + dur - 0.05, 0.3);
}

function playToeter() {
  // Buzzer: laag sawtooth
  const ctx = getCtx();
  [0, 0.05, 0.1].forEach(delay => {
    const osc = ctx.createOscillator();
    const g   = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(160, ctx.currentTime + delay);
    osc.frequency.linearRampToValueAtTime(80, ctx.currentTime + delay + 0.7);
    g.gain.setValueAtTime(0.4, ctx.currentTime + delay);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.8);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(ctx.currentTime + delay);
    osc.stop(ctx.currentTime + delay + 0.85);
  });
}

function playJammer() {
  // Sad trombone: Bb4 → Ab4 → G4 → F4 met glide
  const ctx   = getCtx();
  const notes = [466.16, 415.30, 391.99, 349.23];
  let t = ctx.currentTime;
  notes.forEach((freq, i) => {
    const osc = ctx.createOscillator();
    const g   = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(freq, t);
    if (i < notes.length - 1) {
      osc.frequency.linearRampToValueAtTime(notes[i+1], t + 0.38);
    }
    g.gain.setValueAtTime(0.35, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t); osc.stop(t + 0.5);
    t += 0.33;
  });
}

// ══════════════════════════════════════════════
//  SPELSTATUS
// ══════════════════════════════════════════════
let spelers = [], scores = {}, slokken = {}, ronde = 0, bezig = false;
let huidigeMuziek = null, huidigePersoon = null;

// ══════════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════════
function isSpeciaal(naam) {
  if (!naam) return false;
  const n = naam.trim().toLowerCase().replace(/[\s\-]/g,'');
  return ['gerben','m','mj','markjan'].includes(n);
}
function bouwGewogenLijst(sp) {
  const lst = [];
  sp.forEach(s => { const n = isSpeciaal(s)?16:10; for(let i=0;i<n;i++) lst.push(s); });
  return lst;
}
function rnd(arr) { return arr[Math.floor(Math.random()*arr.length)]; }

// ══════════════════════════════════════════════
//  UI
// ══════════════════════════════════════════════
function bouwNaamGrid() {
  const g = document.getElementById('naam-grid');
  g.innerHTML = '';
  for (let i=1;i<=5;i++) {
    const r = document.createElement('div');
    r.className = 'naam-rij';
    r.innerHTML = `<span class="naam-nummer">${i}</span>
      <input class="naam-input" id="naam-${i}" type="text" placeholder="Naam speler ${i}..."/>`;
    g.appendChild(r);
  }
}

function startSpel() {
  const gevonden = [];
  for (let i=1;i<=5;i++) {
    const n = document.getElementById(`naam-${i}`).value.trim();
    if (n) gevonden.push(n);
  }
  if (gevonden.length < 2) { alert("Voer minimaal 2 namen in!"); return; }
  spelers = gevonden;
  scores  = {}; slokken = {}; ronde = 0;
  spelers.forEach(s => { scores[s]=0; slokken[s]=0; });
  toonScherm('scherm-spelen');
  bouwSpelersBar();
  updateScoreBord();
  document.getElementById('resultaat-kaart').classList.remove('zichtbaar');
  document.getElementById('muziek-kaart').classList.remove('zichtbaar');
  document.getElementById('ronde-info').textContent = 'Druk op de beker om te draaien!';
}

function toonScherm(id) {
  document.querySelectorAll('.scherm').forEach(s=>s.classList.remove('actief'));
  document.getElementById(id).classList.add('actief');
}

function bouwSpelersBar() {
  document.getElementById('spelers-bar').innerHTML = spelers.map(s =>
    `<div class="speler-chip" id="chip-${s.replace(/\s/g,'_')}">${s}</div>`
  ).join('');
}

function updateSpelersBar(actieve) {
  spelers.forEach(s => {
    const c = document.getElementById('chip-'+s.replace(/\s/g,'_'));
    if (c) c.classList.toggle('actief', s===actieve);
  });
}

function updateScoreBord() {
  const gesorteerd = [...spelers].sort((a,b)=>slokken[b]-slokken[a]);
  document.getElementById('score-lijst').innerHTML = gesorteerd.map((s,i) => {
    const m = i===0?'🥇':i===1?'🥈':i===2?'🥉':'🍺';
    return `<div class="score-rij"><span class="score-naam">${m} ${s}</span><span class="score-getal">${slokken[s]} slk</span></div>`;
  }).join('');
}

// ══════════════════════════════════════════════
//  DRAAIEN
// ══════════════════════════════════════════════
function draaiWiel() {
  if (bezig) return;
  bezig = true;
  const beker = document.getElementById('bier-beker');
  document.getElementById('btn-volgende').disabled = true;
  document.getElementById('resultaat-kaart').classList.remove('zichtbaar');
  document.getElementById('muziek-kaart').classList.remove('zichtbaar');
  document.getElementById('yt-sectie').classList.remove('zichtbaar');
  document.getElementById('yt-sectie').innerHTML = '';
  document.getElementById('antwoord-feedback').style.display = 'none';

  beker.classList.add('draaien');
  const spinDuur = 1600 + Math.random() * 1400;
  playSpinTicks(spinDuur);

  setTimeout(() => {
    beker.classList.remove('draaien');
    ronde++;
    document.getElementById('ronde-info').textContent = `Ronde ${ronde}`;

    const gewogen     = bouwGewogenLijst(spelers);
    const gekozen     = rnd(gewogen);
    huidigePersoon    = gekozen;
    scores[gekozen]++;
    updateSpelersBar(gekozen);

    document.getElementById('resultaat-naam').textContent = gekozen.toUpperCase() + ' 🍺';
    document.getElementById('resultaat-actie').textContent =
      'Raad het nummer → niet drinken 🙌\nFout → 5 slokken! 😬';
    document.getElementById('resultaat-kaart').classList.add('zichtbaar');

    laadMuziek(gekozen);
    beker.textContent = '🍺';
    document.getElementById('btn-volgende').disabled = false;
    bezig = false;
  }, spinDuur);
}

// ══════════════════════════════════════════════
//  MUZIEK RONDE
// ══════════════════════════════════════════════
function laadMuziek(speler) {
  const pool = isSpeciaal(speler) ? MUZIEK_ONMOGELIJK : MUZIEK_NORMAAL;
  huidigeMuziek = rnd(pool);

  document.getElementById('lyric-tekst').innerHTML = `"${huidigeMuziek.lyric}"`;
  document.getElementById('muziek-vraag').textContent = huidigeMuziek.vraag;

  const opties = [...huidigeMuziek.opties].sort(() => Math.random() - 0.5);
  document.getElementById('antwoord-knoppen').innerHTML = opties.map(o =>
    `<button class="antwoord-optie" onclick="controleerAntwoord('${o.replace(/'/g,"\\'")}',this)">${o}</button>`
  ).join('');

  document.getElementById('antwoord-feedback').style.display = 'none';
  document.getElementById('yt-sectie').classList.remove('zichtbaar');
  document.getElementById('yt-sectie').innerHTML = '';
  document.getElementById('muziek-kaart').classList.add('zichtbaar');
}

function controleerAntwoord(optie, btn) {
  document.querySelectorAll('.antwoord-optie').forEach(b => b.disabled = true);

  const speciaal  = isSpeciaal(huidigePersoon);
  const echteGoed = huidigeMuziek.goed;
  const isGoed    = speciaal ? false : (optie === echteGoed);

  const feedback = document.getElementById('antwoord-feedback');
  btn.classList.add(isGoed ? 'goed' : 'fout');
  if (!isGoed) {
    document.querySelectorAll('.antwoord-optie').forEach(b => {
      if (b.textContent.trim() === echteGoed) b.classList.add('goed');
    });
  }

  if (isGoed) {
    playJammer();   // correct = jammer voor de rest 😢
    feedback.textContent = `✅ Correct! "${huidigeMuziek.artiest} – ${huidigeMuziek.titel}". Je hoeft NIET te drinken! 🙌`;
    feedback.className   = 'antwoord-feedback goed-fb';
  } else {
    playToeter();   // fout = toeeeeter 📯
    const spot = speciaal ? rnd([
      `❌ Echt niet goed! Het was "${huidigeMuziek.artiest}". 5 slokken, nu! 🍻`,
      `❌ Haha nope! "${huidigeMuziek.artiest}" — 5 slokken! 😂`,
      `❌ Mis! Alsof jij dat weet... "${huidigeMuziek.artiest}". 5 slokken! 😈`,
      `❌ Nope! "${huidigeMuziek.artiest}" — cheers op jouw 5 slokken! 🥂`,
      `❌ Echt fout! "${huidigeMuziek.artiest}" was het. Bek dicht, drinken! 🍺🍺🍺🍺🍺`,
    ]) : `❌ Helaas! Het was "${huidigeMuziek.artiest} – ${huidigeMuziek.titel}". Drink 5 slokken! 🍺`;
    feedback.textContent = spot;
    feedback.className   = 'antwoord-feedback fout-fb';
    slokken[huidigePersoon] = (slokken[huidigePersoon]||0) + 5;
    updateScoreBord();
    schietConfetti('rood');
  }
  feedback.style.display = 'block';

  // YouTube tonen
  setTimeout(() => toonYoutube(huidigeMuziek), 400);
}

// ══════════════════════════════════════════════
//  YOUTUBE
// ══════════════════════════════════════════════
function toonYoutube(muziek) {
  const sectie = document.getElementById('yt-sectie');
  sectie.innerHTML = '';

  if (muziek.yt.id) {
    // Direct embed — autoplay, start na antwoord
    sectie.innerHTML = `
      <iframe
        src="https://www.youtube-nocookie.com/embed/${muziek.yt.id}?autoplay=1&rel=0&modestbranding=1"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>`;
  } else {
    // Zoekknop naar YouTube
    const q = encodeURIComponent(muziek.yt.search);
    sectie.innerHTML = `
      <a class="yt-zoek-btn" href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="white">
          <path d="M21.8 8s-.2-1.4-.8-2c-.8-.8-1.6-.8-2-.9C16.7 5 12 5 12 5s-4.7 0-7 .1c-.4.1-1.3.1-2 .9-.6.6-.8 2-.8 2S2 9.6 2 11.2v1.5c0 1.6.2 3.2.2 3.2s.2 1.4.8 2c.8.8 1.8.8 2.2.8C6.8 19 12 19 12 19s4.7 0 7-.2c.4-.1 1.3-.1 2-.9.6-.6.8-2 .8-2s.2-1.6.2-3.2v-1.5C22 9.6 21.8 8 21.8 8zM9.7 14.5V9l5.3 2.8-5.3 2.7z"/>
        </svg>
        ▶ ${muziek.artiest} — ${muziek.titel}
      </a>`;
  }
  sectie.classList.add('zichtbaar');
}

// ══════════════════════════════════════════════
//  CONFETTI
// ══════════════════════════════════════════════
function schietConfetti(kleur) {
  const container = document.getElementById('confetti');
  const kleuren = kleur==='rood'
    ? ['#d63031','#ff7675','#fdcb6e','#e17055']
    : ['#f5a623','#ffd32a','#00b894','#7b2d8b','#fff'];
  for (let i=0;i<35;i++) {
    setTimeout(() => {
      const p = document.createElement('div');
      p.className = 'confetti-piece';
      p.style.cssText = `left:${Math.random()*100}%;top:-10px;background:${rnd(kleuren)};
        width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;
        animation-delay:${Math.random()*.4}s;animation-duration:${1.5+Math.random()}s;`;
      container.appendChild(p);
      setTimeout(() => p.remove(), 2500);
    }, i*40);
  }
}

// ══════════════════════════════════════════════
//  RESET
// ══════════════════════════════════════════════
function resetSpel() {
  spelers=[]; scores={}; slokken={}; ronde=0;
  toonScherm('scherm-namen');
  bouwNaamGrid();
}

// INIT
bouwNaamGrid();
</script>
